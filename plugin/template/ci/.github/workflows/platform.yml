# .github/workflows/platform.yml of an app repository: deploys to the platform on push to the default branch,
# checks pull requests (company checks, migrations dry run with the security linter, build). Nothing else is
# needed in the repository: no deploy secret (GitHub OIDC), the platform URL is below.
#
# The platform only deploys from the default branch linked to the app (link_repo).
name: Platform

on:
  push:
    branches: [__BRANCH__] # the app's default branch
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  platform:
    # the reusable workflow allowed by the platform admin (whoami ci.uses)
    uses: __USES__
    with:
      mode: ${{ github.event_name == 'push' && 'deploy' || 'check' }}
      platform-url: __PLATFORM_URL__
