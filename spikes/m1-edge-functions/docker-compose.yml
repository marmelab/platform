name: m1

services:
  edge:
    image: supabase/edge-runtime:v1.76.2
    command: ["start", "--main-service", "/main", "--event-worker", "/main/events", "--port", "9000", "--policy", "per_worker"]
    env_file: runtime/secrets.env
    environment:
      PLATFORM_FUNCTIONS_ROOT: /functions
      PLATFORM_APPS_CONFIG_DIR: /config/apps
      DENO_DIR: /deno-cache
    volumes:
      - ../../packages/edge-main-worker:/main:ro
      - functions:/functions:ro
      - apps-config:/config/apps:ro
      - deno-cache:/deno-cache
    mem_limit: 2g
    expose:
      - "9000"

  caddy:
    image: caddy:2-alpine
    env_file: runtime/secrets.env
    volumes:
      - ./runtime/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8090:8090"
    depends_on:
      - edge

  # Stands in for the control plane: the only writer of the functions and apps-config volumes.
  controlplane:
    image: caddy:2-alpine
    entrypoint: ["sleep", "100000000"]
    init: true
    volumes:
      - ./runtime:/src:ro
      - functions:/functions
      - apps-config:/config/apps

volumes:
  deno-cache:
  functions:
  apps-config:
