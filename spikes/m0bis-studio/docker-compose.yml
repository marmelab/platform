name: m0bis

# Multi-head Studio + one shared postgres-meta, plugged into the m0 network (Postgres "db", Caddy).
# No Kong, no default Supabase stack. The only extra service is a small GoTrue that Studio needs
# for its own dashboard login (the published image is built with NEXT_PUBLIC_STUDIO_AUTH=gotrue).
# Studio publishes no port: it is reachable only through Caddy (studio.localhost:8080) + forward auth.

x-labels: &labels
  platform.component: studio

services:
  studio:
    # Published image f88e4b4 (2026-06-09, pinned by digest in patch/Dockerfile) + a one-line sed
    # patch for external projects. linux/amd64 only: runs under emulation on Apple Silicon.
    image: m0bis/studio-mh:f88e4b4-patched
    build:
      context: ./patch
    platform: linux/amd64
    container_name: m0bis-studio
    restart: unless-stopped
    mem_limit: 1g
    depends_on: [studio-meta, studio-auth]
    # Spike only: the apps' public_url (http://<id>.localhost:8080) must also resolve from inside
    # Studio (health poller, server-side calls). In production public_url is a real DNS name.
    extra_hosts:
      - app1.localhost:host-gateway
      - app2.localhost:host-gateway
    volumes:
      - ./data/studio:/app/studio-data
      - ./data/snippets:/app/snippets
      - ./data/functions:/app/edge-functions
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_DATA_DIR: /app/studio-data
      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
      EDGE_FUNCTIONS_MANAGEMENT_FOLDER: /app/edge-functions
      STUDIO_PG_META_URL: http://studio-meta:8080
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      DEFAULT_ORGANIZATION_NAME: Platform
      DEFAULT_PROJECT_NAME: "(unused default)"
      # Studio's own login (dashboard users), not the apps' GoTrue
      STUDIO_GOTRUE_URL: http://studio-auth:9999
      STUDIO_GOTRUE_SERVICE_KEY: ${STUDIO_SERVICE_KEY}
      AUTH_JWT_SECRET: ${STUDIO_JWT_SECRET}
      SUPABASE_PUBLIC_URL: http://studio.localhost:8080
      # Global "default project" endpoints: deliberately unreachable so that every route that
      # ignores the project ref fails closed instead of hitting some other backend.
      SUPABASE_URL: http://unreachable.invalid
      SUPABASE_ANON_KEY: none
      SUPABASE_SERVICE_KEY: none
      MULTI_HEAD_HOST: unreachable.invalid
      LOGFLARE_URL: http://unreachable.invalid
      NEXT_PUBLIC_ENABLE_LOGS: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    labels: *labels

  studio-meta:
    image: supabase/postgres-meta:v0.99.0
    container_name: m0bis-meta
    restart: unless-stopped
    mem_limit: 256m
    environment:
      PG_META_PORT: 8080
      # Default connection (used when no x-connection-encrypted header is sent):
      # an empty database with a role that has no privileges.
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: studio_meta_default
      PG_META_DB_USER: studio_meta_default
      PG_META_DB_PASSWORD: ${META_DEFAULT_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
    labels: *labels

  studio-auth:
    image: supabase/gotrue:v2.196.0
    container_name: m0bis-auth
    restart: unless-stopped
    mem_limit: 128m
    command: ["auth"]
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://studio.localhost:8080/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://studio_auth_admin:${STUDIO_AUTH_ADMIN_PASSWORD}@db:5432/studio_auth?sslmode=disable
      GOTRUE_DB_MAX_POOL_SIZE: 2
      GOTRUE_SITE_URL: http://studio.localhost:8080
      GOTRUE_URI_ALLOW_LIST: http://studio.localhost:8080/**
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${STUDIO_JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
    labels: *labels

  fwd-auth:
    image: node:22-alpine
    container_name: m0bis-fwd-auth
    restart: unless-stopped
    mem_limit: 64m
    command: ["node", "/srv/server.mjs"]
    volumes:
      - ./fwd-auth/server.mjs:/srv/server.mjs:ro
    environment:
      FWD_AUTH_USER: ${FWD_AUTH_USER}
      FWD_AUTH_PASSWORD: ${FWD_AUTH_PASSWORD}
      FWD_AUTH_SESSION_SECRET: ${FWD_AUTH_SESSION_SECRET}
    labels: *labels

networks:
  default:
    name: m0
    external: true
