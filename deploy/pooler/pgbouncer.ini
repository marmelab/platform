; Connection pooler of the app databases (apps/control-plane/README.md, "Connection pooler"). PostgREST and Storage connect through it in
; transaction mode; GoTrue, Realtime (session-bound features: temporary replication slots, walsender), the owner role
; and the platform connect to Postgres directly.

[databases]
; auth_query runs here, as platform_pooler (packages/sql poolerAuthSql)
platform_pooler_auth = host=db port=5432 dbname=postgres pool_size=2 max_db_connections=3
; one entry per app database, written by the control plane (apps/control-plane/src/pooler.ts), applied by RELOAD
%include /etc/pgbouncer/dynamic/databases.ini

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =

; clients log in with their own role and password: the SCRAM secret is read with auth_query, and the client's SCRAM
; keys are reused to log in to Postgres. auth_file: the auth_query role and the admin console user only (written
; from the environment when the container starts).
auth_type = scram-sha-256
auth_file = /tmp/userlist.txt
auth_user = platform_pooler
auth_dbname = platform_pooler_auth
auth_query = SELECT usename, passwd FROM platform_pooler.get_auth($1)
admin_users = pooler_admin

; transaction pooling: a server connection is held for the duration of a transaction only. PostgREST runs without
; prepared statements (PGRST_DB_PREPARED_STATEMENTS=false); protocol-level ones (node-postgres, drivers) are tracked.
pool_mode = transaction
max_prepared_statements = 200
; per database and role; max_db_connections (per database, all roles: 6, PostgREST's 3 + Storage's 3, so that one
; never waits for the other's idle connections) is set on each entry by the control plane
default_pool_size = 3
min_pool_size = 0
reserve_pool_size = 0
max_client_conn = 2000
; idle server connections are closed after 30 s: an app without traffic holds none
server_idle_timeout = 30
server_lifetime = 3600
server_connect_timeout = 5
query_wait_timeout = 30
ignore_startup_parameters = extra_float_digits

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60
