name: plat

services:
  db:
    image: supabase/postgres:17.6.1.136
    container_name: plat-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:54350:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - "log_line_prefix=%m [%p] db=%d user=%u app=%a "
      - -c
      - max_connections=500
      # Realtime (M5): per app with clients, one temporary logical replication slot for postgres_changes subscribers
      # and one walsender with its temporary slot for "broadcast changes" (patched image, patches/realtime)
      - -c
      - max_replication_slots=128
      - -c
      - max_wal_senders=64
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 3s
      timeout: 3s
      retries: 60
    labels:
      platform.service: postgres

  caddy:
    image: caddy:2-alpine
    container_name: plat-caddy
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/caddy.json", "--resume"]
    environment:
      PLATFORM_GATEWAY_TOKEN: ${PLATFORM_GATEWAY_TOKEN}
    ports:
      - "127.0.0.1:8100:8100"
      - "127.0.0.1:2030:2019"
    volumes:
      - ./caddy/caddy.json:/etc/caddy/caddy.json:ro
      - caddy-config:/config
      - caddy-data:/data
      - sites:/sites:ro
      # access log of the app hosts (JSON, rotated by Caddy), read by the control plane's metrics sampler
      - caddy-logs:/var/log/caddy
    labels:
      platform.service: caddy

  edge:
    image: supabase/edge-runtime:v1.76.2
    container_name: plat-edge
    restart: unless-stopped
    command: ["start", "--main-service", "/main", "--event-worker", "/main/events", "--port", "9000", "--policy", "per_worker"]
    environment:
      PLATFORM_GATEWAY_TOKEN: ${PLATFORM_GATEWAY_TOKEN}
      PLATFORM_ADMIN_TOKEN: ${PLATFORM_EDGE_ADMIN_TOKEN}
      PLATFORM_FUNCTIONS_ROOT: /functions
      PLATFORM_APPS_CONFIG_DIR: /config/apps
      PLATFORM_WORKER_IDLE_TIMEOUT_MS: "30000"
      PLATFORM_WARM_TIMEOUT_MS: "45000"
      DENO_DIR: /deno-cache
    volumes:
      - ../apps/edge-main-worker:/main:ro
      - functions:/functions:ro
      - apps-config:/config/apps:ro
      - deno-cache:/deno-cache
    mem_limit: 1g
    labels:
      platform.service: edge

  control-plane:
    build:
      context: ..
      dockerfile: apps/control-plane/Dockerfile
    image: plat/control-plane:dev
    container_name: plat-control-plane
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      caddy:
        condition: service_started
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PLATFORM_MASTER_KEY: ${PLATFORM_MASTER_KEY}
      PLATFORM_EDGE_ADMIN_TOKEN: ${PLATFORM_EDGE_ADMIN_TOKEN}
      PLATFORM_STUDIO_HEADER_SECRET: ${PLATFORM_STUDIO_HEADER_SECRET}
      PLATFORM_STUDIO_CONFIG_TOKEN: ${PLATFORM_STUDIO_CONFIG_TOKEN}
      STUDIO_META_DEFAULT_PASSWORD: ${STUDIO_META_DEFAULT_PASSWORD}
      STUDIO_HOST: studio.localhost
      # admin console and its API (apps/admin, built into this image), proxied by Caddy (route "admin")
      ADMIN_HOST: admin.localhost
      PGHOST: db
      APPS_DOMAIN: localhost
      PUBLIC_PORT: "8100"
      API_HOST: api.localhost
      CADDY_ADMIN_URL: http://caddy:2019
      DOCKER_NETWORK: plat
      # Platform settings (apps/control-plane/README.md, "Settings"). DIRECT_DEPLOY: "admins" in production;
      # install.sh writes "everyone" into deploy/.env for local installs.
      DIRECT_DEPLOY: ${DIRECT_DEPLOY:-admins}
      CI_ALLOWED_WORKFLOWS: ${CI_ALLOWED_WORKFLOWS:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-https://token.actions.githubusercontent.com}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      # Test only (SEC-10): honour the inline oidc_jwks setting. install.sh writes 1 for local installs; never in
      # production.
      ALLOW_TEST_OIDC_JWKS: ${ALLOW_TEST_OIDC_JWKS:-}
      # A6: an app without request nor release for this many days is flagged "abandoned"; app_metrics retention
      ABANDONED_AFTER_DAYS: ${ABANDONED_AFTER_DAYS:-}
      METRICS_RETENTION_DAYS: ${METRICS_RETENTION_DAYS:-}
      # Storage and Realtime (M5): tenant management (admin APIs on the internal network) and metadata databases
      STORAGE_ADMIN_KEY: ${STORAGE_ADMIN_KEY}
      STORAGE_DB_PASSWORD: ${STORAGE_DB_PASSWORD}
      REALTIME_API_JWT_SECRET: ${REALTIME_API_JWT_SECRET}
      REALTIME_DB_PASSWORD: ${REALTIME_DB_PASSWORD}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sites:/data/sites
      - functions:/data/functions
      - apps-config:/data/config/apps
      - uploads:/data/uploads
      # final backups taken by delete_app (<slug>-<timestamp>/): restore, retention and off-site copy are M7
      - backups:/data/backups
      # Caddy's access log (requests and 5xx per app, app_metrics)
      - caddy-logs:/data/caddy-logs:ro
      # Storage files (<bucket>/<slug>/...): final backups (B8) and deletion
      - storage-data:/data/storage
    labels:
      platform.service: control-plane

  # Storage API (M5), one shared multi-tenant instance: one tenant per app (registered by the control plane through the
  # admin API on :5001), the tenant taken from X-Forwarded-Host, set by Caddy to the app's slug. Files on the
  # storage-data volume, under tenants/<slug>/. No published port.
  storage:
    image: supabase/storage-api:v1.74.0
    container_name: plat-storage
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    environment:
      IS_MULTITENANT: "true"
      # tenants metadata database, created by the control plane (init)
      MULTITENANT_DATABASE_URL: postgres://platform_storage:${STORAGE_DB_PASSWORD}@db:5432/platform_storage
      MULTITENANT_DATABASE_MAX_CONNECTIONS: "5"
      ADMIN_API_KEYS: ${STORAGE_ADMIN_KEY}
      ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY}
      REQUEST_X_FORWARDED_HOST_REGEXP: ^([a-z][a-z0-9-]{1,30}[a-z0-9])$$
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      GLOBAL_S3_BUCKET: tenants
      FILE_SIZE_LIMIT: "52428800"
      REGION: local
      # roles are created by the control plane (app_<id>_storage_admin), never by Storage's migrations
      DB_INSTALL_ROLES: "false"
      DATABASE_FREE_POOL_AFTER_INACTIVITY: "60000"
      S3_PROTOCOL_ENABLED: "false"
      PG_QUEUE_ENABLE: "false"
    volumes:
      - storage-data:/var/lib/storage
    labels:
      platform.service: storage

  # Realtime (M5), one shared multi-tenant instance: one tenant per app (registered by the control plane through its
  # API), the tenant taken from the first label of the Host header, set by Caddy to <slug>.realtime. No published port.
  # Patched upstream image (patches/realtime, built by install.sh): the "broadcast changes" slot is named per tenant
  # (SLOT_NAME_PER_TENANT).
  realtime:
    image: plat/realtime:v2.134.10-platform1
    container_name: plat-realtime
    restart: unless-stopped
    mem_limit: 1g
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "4000"
      # tenants metadata database (schema _realtime), created by the control plane (init)
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: platform_realtime
      DB_PASSWORD: ${REALTIME_DB_PASSWORD}
      DB_NAME: platform_realtime
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY}
      API_JWT_SECRET: ${REALTIME_API_JWT_SECRET}
      METRICS_JWT_SECRET: ${REALTIME_API_JWT_SECRET}
      SECRET_KEY_BASE: ${REALTIME_SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "false"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"
      SLOT_NAME_PER_TENANT: "true"
    labels:
      platform.service: realtime

  # Multi-head Studio (apps/studio, image built on the host by apps/studio/build.sh). No published port:
  # reachable only through Caddy (studio.localhost:8100) behind the control plane's forward auth.
  studio:
    image: plat/studio:dev
    container_name: plat-studio
    restart: unless-stopped
    mem_limit: 1g
    depends_on: [studio-meta, control-plane]
    environment:
      PLATFORM_CONTROL_PLANE_URL: http://control-plane:3001
      PLATFORM_STUDIO_CONFIG_TOKEN: ${PLATFORM_STUDIO_CONFIG_TOKEN}
      PLATFORM_STUDIO_HEADER_SECRET: ${PLATFORM_STUDIO_HEADER_SECRET}
      STUDIO_PG_META_URL: http://studio-meta:8080
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      STUDIO_DATA_DIR: /tmp/studio-data
      DEFAULT_ORGANIZATION_NAME: Platform
      SUPABASE_PUBLIC_URL: http://studio.localhost:8100
      # Global "default project" of the fork: unreachable on purpose, every route must use its project
      SUPABASE_URL: http://unreachable.invalid
      SUPABASE_ANON_KEY: none
      SUPABASE_SERVICE_KEY: none
      MULTI_HEAD_HOST: unreachable.invalid
      LOGFLARE_URL: http://unreachable.invalid
    labels:
      platform.service: studio

  # Shared postgres-meta. Its default connection is an empty database with a role without privileges;
  # Studio sends each project's connection in x-connection-encrypted.
  studio-meta:
    image: supabase/postgres-meta:v0.99.0
    container_name: plat-studio-meta
    restart: unless-stopped
    mem_limit: 384m
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: studio_meta_default
      PG_META_DB_USER: studio_meta_default
      PG_META_DB_PASSWORD: ${STUDIO_META_DEFAULT_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
    labels:
      platform.service: studio-meta

volumes:
  db-data:
  caddy-config:
  caddy-data:
  sites:
  functions:
  apps-config:
  uploads:
  backups:
  deno-cache:
  caddy-logs:
  storage-data:

networks:
  default:
    name: plat
