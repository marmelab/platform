name: plat

services:
  db:
    image: supabase/postgres:17.6.1.136
    container_name: plat-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:54350:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - "log_line_prefix=%m [%p] db=%d user=%u app=%a "
      - -c
      - max_connections=500
      # Realtime (M5): per app with clients, one temporary logical replication slot for postgres_changes subscribers
      # and one walsender with its temporary slot for "broadcast changes" (patched image, patches/realtime)
      - -c
      - max_replication_slots=128
      - -c
      - max_wal_senders=64
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 3s
      timeout: 3s
      retries: 60
    labels:
      platform.service: postgres

  caddy:
    image: caddy:2-alpine
    container_name: plat-caddy
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/caddy.json", "--resume"]
    environment:
      PLATFORM_GATEWAY_TOKEN: ${PLATFORM_GATEWAY_TOKEN}
      # bootstrap config (caddy/caddy.json) before the control plane's first start, which then owns the public server
      # (listen address, TLS, API host: router.ensureEdge)
      PLATFORM_API_HOST: api.${PLATFORM_DOMAIN:-localhost}
      PLATFORM_PUBLIC_PORT: ${PUBLIC_PORT:-8100}
    ports:
      # local installs: the public server on 127.0.0.1:8100 (plain HTTP). Production (install.sh --production):
      # CADDY_HTTP_PUBLISH=80 and CADDY_HTTP_PORT=80 (redirect to HTTPS, ACME HTTP challenge), CADDY_HTTPS_PUBLISH=443
      - "${CADDY_HTTP_PUBLISH:-127.0.0.1:8100}:${CADDY_HTTP_PORT:-8100}"
      - "${CADDY_HTTPS_PUBLISH:-127.0.0.1:8443}:443"
      - "127.0.0.1:2030:2019"
    volumes:
      - ./caddy/caddy.json:/etc/caddy/caddy.json:ro
      - caddy-config:/config
      - caddy-data:/data
      - sites:/sites:ro
      # access log of the app hosts (JSON, rotated by Caddy), read by the control plane's metrics sampler
      - caddy-logs:/var/log/caddy
    labels:
      platform.service: caddy

  edge:
    image: supabase/edge-runtime:v1.76.2
    container_name: plat-edge
    restart: unless-stopped
    command: ["start", "--main-service", "/main", "--event-worker", "/main/events", "--port", "9000", "--policy", "per_worker"]
    environment:
      PLATFORM_GATEWAY_TOKEN: ${PLATFORM_GATEWAY_TOKEN}
      PLATFORM_ADMIN_TOKEN: ${PLATFORM_EDGE_ADMIN_TOKEN}
      PLATFORM_FUNCTIONS_ROOT: /functions
      PLATFORM_APPS_CONFIG_DIR: /config/apps
      PLATFORM_WORKER_IDLE_TIMEOUT_MS: "30000"
      PLATFORM_WARM_TIMEOUT_MS: "45000"
      DENO_DIR: /deno-cache
    volumes:
      - ../apps/edge-main-worker:/main:ro
      - functions:/functions:ro
      - apps-config:/config/apps:ro
      - deno-cache:/deno-cache
    mem_limit: 1g
    labels:
      platform.service: edge

  # Connection pooler (apps/control-plane/README.md, "Connection pooler"): PgBouncer in transaction mode in front of the app databases, for
  # PostgREST and Storage. Static settings in pooler/pgbouncer.ini; one [databases] entry per app, written by the control
  # plane into the pooler-config volume and applied with RELOAD. No published port.
  pooler:
    image: edoburu/pgbouncer:v1.25.1-p0
    container_name: plat-pooler
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      db:
        condition: service_healthy
    environment:
      POOLER_AUTH_PASSWORD: ${POOLER_AUTH_PASSWORD}
      POOLER_ADMIN_PASSWORD: ${POOLER_ADMIN_PASSWORD}
    # userlist: the auth_query role and the admin console user; the entries file is created by the control plane
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        printf '"platform_pooler" "%s"\n"pooler_admin" "%s"\n' "$$POOLER_AUTH_PASSWORD" "$$POOLER_ADMIN_PASSWORD" > /tmp/userlist.txt
        until [ -f /etc/pgbouncer/dynamic/databases.ini ]; do sleep 1; done
        exec pgbouncer /etc/pgbouncer/pgbouncer.ini
    volumes:
      - ./pooler/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - pooler-config:/etc/pgbouncer/dynamic:ro
    labels:
      platform.service: pooler

  control-plane:
    build:
      context: ..
      dockerfile: apps/control-plane/Dockerfile
    image: plat/control-plane:dev
    container_name: plat-control-plane
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      caddy:
        condition: service_started
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PLATFORM_MASTER_KEY: ${PLATFORM_MASTER_KEY}
      PLATFORM_EDGE_ADMIN_TOKEN: ${PLATFORM_EDGE_ADMIN_TOKEN}
      PLATFORM_STUDIO_HEADER_SECRET: ${PLATFORM_STUDIO_HEADER_SECRET}
      PLATFORM_STUDIO_CONFIG_TOKEN: ${PLATFORM_STUDIO_CONFIG_TOKEN}
      STUDIO_META_DEFAULT_PASSWORD: ${STUDIO_META_DEFAULT_PASSWORD}
      # Hosts (config.ts): apps on <slug>.<domain>, api.<domain>, admin.<domain> (admin console and its API, apps/admin
      # built into this image), <domain> (Studio). install.sh --production writes PLATFORM_DOMAIN, PUBLIC_SCHEME=https,
      # PUBLIC_PORT=443 and TLS_MODE (acme, or internal: Caddy's own CA) into deploy/.env.
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-localhost}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-http}
      PUBLIC_PORT: ${PUBLIC_PORT:-8100}
      TLS_MODE: ${TLS_MODE:-off}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_CA: ${ACME_CA:-}
      HTTP_PORT: ${CADDY_HTTP_PORT:-80}
      PGHOST: db
      CADDY_ADMIN_URL: http://caddy:2019
      DOCKER_NETWORK: plat
      # Platform settings (apps/control-plane/README.md, "Settings"). DIRECT_DEPLOY: "admins" in production;
      # install.sh writes "everyone" into deploy/.env for local installs.
      DIRECT_DEPLOY: ${DIRECT_DEPLOY:-admins}
      CI_ALLOWED_WORKFLOWS: ${CI_ALLOWED_WORKFLOWS:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-https://token.actions.githubusercontent.com}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      # Test only (SEC-10): honour the inline oidc_jwks setting. install.sh writes 1 for local installs; never in
      # production.
      ALLOW_TEST_OIDC_JWKS: ${ALLOW_TEST_OIDC_JWKS:-}
      # A6: an app without request nor release for this many days is flagged "abandoned"; app_metrics retention
      ABANDONED_AFTER_DAYS: ${ABANDONED_AFTER_DAYS:-}
      METRICS_RETENTION_DAYS: ${METRICS_RETENTION_DAYS:-}
      # Platform SMTP (M6, apps/control-plane/README.md, "Email"): every app's GoTrue (confirmation, password reset,
      # invitations) and the platform's own emails. Production: the company relay. install.sh points local installs to
      # the mailpit catcher below. Overridden at runtime by the smtp_* settings.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SENDER_EMAIL: ${SMTP_SENDER_EMAIL:-}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-}
      # Company SSO (M6 part 2, apps/control-plane/README.md, "Company SSO"): usually set in the admin console (SSO),
      # which overrides these defaults. SSO_CLIENT_SECRET is stored encrypted when set from the console.
      SSO_ENABLED: ${SSO_ENABLED:-}
      SSO_NAME: ${SSO_NAME:-}
      SSO_ISSUER: ${SSO_ISSUER:-}
      SSO_DISCOVERY_URL: ${SSO_DISCOVERY_URL:-}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      SSO_ALLOWED_DOMAINS: ${SSO_ALLOWED_DOMAINS:-}
      SSO_REQUIRE_VERIFIED_EMAIL: ${SSO_REQUIRE_VERIFIED_EMAIL:-}
      SSO_AUTO_CREATE: ${SSO_AUTO_CREATE:-}
      SSO_PASSWORD_LOGIN: ${SSO_PASSWORD_LOGIN:-}
      # Local installs only (install.sh, profile sso-test): the apps' GoTrue join the mock IdP's network and trust its CA
      SSO_TEST_NETWORK: ${SSO_TEST_NETWORK:-}
      SSO_TEST_CA_VOLUME: ${SSO_TEST_CA_VOLUME:-}
      # Storage and Realtime (M5): tenant management (admin APIs on the internal network) and metadata databases
      STORAGE_ADMIN_KEY: ${STORAGE_ADMIN_KEY}
      STORAGE_DB_PASSWORD: ${STORAGE_DB_PASSWORD}
      REALTIME_API_JWT_SECRET: ${REALTIME_API_JWT_SECRET}
      REALTIME_DB_PASSWORD: ${REALTIME_DB_PASSWORD}
      # connection pooler: admin console (RELOAD, KILL) and the auth_query role's password (set by init)
      POOLER_ADMIN_PASSWORD: ${POOLER_ADMIN_PASSWORD}
      POOLER_AUTH_PASSWORD: ${POOLER_AUTH_PASSWORD}
      # Backups (M7, apps/control-plane/README.md, "Backups"): daily at BACKUP_HOUR (UTC) on the backups volume, or on
      # an S3-compatible bucket when BACKUP_S3_* are set (or the backup_s3_* settings, which override them).
      BACKUP_ENABLED: ${BACKUP_ENABLED:-}
      BACKUP_HOUR: ${BACKUP_HOUR:-}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-}
      BACKUP_MANUAL_RETENTION_DAYS: ${BACKUP_MANUAL_RETENTION_DAYS:-}
      BACKUP_FINAL_RETENTION_DAYS: ${BACKUP_FINAL_RETENTION_DAYS:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-}
      BACKUP_S3_PATH_STYLE: ${BACKUP_S3_PATH_STYLE:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sites:/data/sites
      - functions:/data/functions
      - apps-config:/data/config/apps
      - uploads:/data/uploads
      # backups (M7, <slug>-<timestamp>/): kept here without an S3 target, staging area with one
      - backups:/data/backups
      # Caddy's access log (requests and 5xx per app, app_metrics)
      - caddy-logs:/data/caddy-logs:ro
      # Storage files (<bucket>/<slug>/...): backups, restores and deletion
      - storage-data:/data/storage
      # the pooler's [databases] entries (pooler.ts)
      - pooler-config:/data/pooler
    labels:
      platform.service: control-plane

  # Storage API (M5), one shared multi-tenant instance: one tenant per app (registered by the control plane through the
  # admin API on :5001), the tenant taken from X-Forwarded-Host, set by Caddy to the app's slug. Files on the
  # storage-data volume, under tenants/<slug>/. No published port.
  storage:
    image: supabase/storage-api:v1.74.0
    container_name: plat-storage
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    environment:
      IS_MULTITENANT: "true"
      # tenants metadata database, created by the control plane (init)
      MULTITENANT_DATABASE_URL: postgres://platform_storage:${STORAGE_DB_PASSWORD}@db:5432/platform_storage
      MULTITENANT_DATABASE_MAX_CONNECTIONS: "5"
      ADMIN_API_KEYS: ${STORAGE_ADMIN_KEY}
      ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY}
      REQUEST_X_FORWARDED_HOST_REGEXP: ^([a-z][a-z0-9-]{1,30}[a-z0-9])$$
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      GLOBAL_S3_BUCKET: tenants
      FILE_SIZE_LIMIT: "52428800"
      REGION: local
      # roles are created by the control plane (app_<id>_storage_admin), never by Storage's migrations
      DB_INSTALL_ROLES: "false"
      DATABASE_FREE_POOL_AFTER_INACTIVITY: "60000"
      S3_PROTOCOL_ENABLED: "false"
      PG_QUEUE_ENABLE: "false"
    volumes:
      - storage-data:/var/lib/storage
    labels:
      platform.service: storage

  # Realtime (M5), one shared multi-tenant instance: one tenant per app (registered by the control plane through its
  # API), the tenant taken from the first label of the Host header, set by Caddy to <slug>.realtime. No published port.
  # Patched upstream image (patches/realtime, built by install.sh): the "broadcast changes" slot is named per tenant
  # (SLOT_NAME_PER_TENANT). Connects to the app databases directly, not through the pooler.
  realtime:
    image: plat/realtime:v2.134.10-platform1
    container_name: plat-realtime
    restart: unless-stopped
    mem_limit: 1g
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "4000"
      # tenants metadata database (schema _realtime), created by the control plane (init)
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: platform_realtime
      DB_PASSWORD: ${REALTIME_DB_PASSWORD}
      DB_NAME: platform_realtime
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY}
      API_JWT_SECRET: ${REALTIME_API_JWT_SECRET}
      METRICS_JWT_SECRET: ${REALTIME_API_JWT_SECRET}
      SECRET_KEY_BASE: ${REALTIME_SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "false"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"
      SLOT_NAME_PER_TENANT: "true"
    labels:
      platform.service: realtime

  # Multi-head Studio (apps/studio, image built on the host by apps/studio/build.sh). No published port:
  # reachable only through Caddy (<domain>) behind the control plane's forward auth.
  studio:
    image: plat/studio:dev
    container_name: plat-studio
    restart: unless-stopped
    mem_limit: 1g
    depends_on: [studio-meta, control-plane]
    environment:
      PLATFORM_CONTROL_PLANE_URL: http://control-plane:3001
      PLATFORM_STUDIO_CONFIG_TOKEN: ${PLATFORM_STUDIO_CONFIG_TOKEN}
      PLATFORM_STUDIO_HEADER_SECRET: ${PLATFORM_STUDIO_HEADER_SECRET}
      STUDIO_PG_META_URL: http://studio-meta:8080
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      STUDIO_DATA_DIR: /tmp/studio-data
      DEFAULT_ORGANIZATION_NAME: Platform
      SUPABASE_PUBLIC_URL: ${STUDIO_PUBLIC_URL:-http://localhost:8100}
      # Global "default project" of the fork: unreachable on purpose, every route must use its project
      SUPABASE_URL: http://unreachable.invalid
      SUPABASE_ANON_KEY: none
      SUPABASE_SERVICE_KEY: none
      MULTI_HEAD_HOST: unreachable.invalid
      LOGFLARE_URL: http://unreachable.invalid
    labels:
      platform.service: studio

  # Shared postgres-meta. Its default connection is an empty database with a role without privileges;
  # Studio sends each project's connection in x-connection-encrypted.
  studio-meta:
    image: supabase/postgres-meta:v0.99.0
    container_name: plat-studio-meta
    restart: unless-stopped
    mem_limit: 384m
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: studio_meta_default
      PG_META_DB_USER: studio_meta_default
      PG_META_DB_PASSWORD: ${STUDIO_META_DEFAULT_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
    labels:
      platform.service: studio-meta

  # Local mail catcher (M6), local installs only: install.sh writes COMPOSE_PROFILES=mail and SMTP_HOST=mailpit into
  # deploy/.env. Every email of the platform and of the apps lands here: web UI and API on http://localhost:8025 (the
  # e2e suites read it). Never in production: point SMTP_* to the company relay instead.
  mailpit:
    image: axllent/mailpit:v1.29.7
    container_name: plat-mailpit
    restart: unless-stopped
    profiles: [mail]
    mem_limit: 128m
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "5000"
    ports:
      - "127.0.0.1:8025:8025"
    labels:
      platform.service: mailpit

  # Mock OpenID Connect provider (M6 part 2), local installs only: install.sh adds the sso-test profile to
  # COMPOSE_PROFILES. The company IdP of the local stack and of the e2e suites: platform SSO login and the apps'
  # "custom:company" provider. It signs in any email (deploy/idp/mock-idp.ts). Runs on the control plane image (Node).
  # Issuer https://idp.sso.test:8443, served on the plat-sso-test network at a non-private address, because GoTrue
  # refuses private and plain-HTTP issuers; authorization requests on http://localhost:8090 (the browser).
  idp:
    image: plat/control-plane:dev
    pull_policy: never
    container_name: plat-idp
    restart: unless-stopped
    profiles: [sso-test]
    depends_on: [control-plane]
    mem_limit: 128m
    working_dir: /idp
    command: ["node", "/idp/mock-idp.ts"]
    environment:
      IDP_ISSUER: https://idp.sso.test:8443
      IDP_PUBLIC_URL: http://localhost:8090
      IDP_INTERNAL_URL: http://idp:8090
      IDP_CLIENTS: platform:platform-secret
    volumes:
      - ./idp:/idp:ro
      - idp-keys:/keys
      - idp-ca:/ca
    ports:
      - "127.0.0.1:8090:8090"
    networks:
      default: {}
      sso-test:
        ipv4_address: 198.51.100.10
        aliases: [idp.sso.test]
    labels:
      platform.service: idp

  # S3-compatible object store (M7), local installs only: install.sh adds the s3-test profile to COMPOSE_PROFILES.
  # The off-site backup target of the e2e suites (backups.e2e), unused until the backup_s3_* settings point to it
  # (http://s3:8333, bucket created by the suite). SeaweedFS rather than MinIO, whose images are no longer published.
  # S3 API on http://localhost:8333 for the tests. Never in production: use the company's S3 bucket.
  s3:
    image: chrislusf/seaweedfs:3.97
    container_name: plat-s3
    restart: unless-stopped
    profiles: [s3-test]
    mem_limit: 256m
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"platform","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=64 -volume.max=0
    environment:
      S3_ACCESS_KEY: platform-test
      S3_SECRET_KEY: ${S3_TEST_SECRET_KEY:-}
    volumes:
      - s3-data:/data
    ports:
      - "127.0.0.1:8333:8333"
    labels:
      platform.service: s3

volumes:
  db-data:
  caddy-config:
  caddy-data:
  sites:
  functions:
  apps-config:
  uploads:
  backups:
  deno-cache:
  caddy-logs:
  storage-data:
  pooler-config:
  s3-data:
  idp-keys:
  idp-ca:
    name: plat_idp-ca

networks:
  default:
    name: plat
  # mock IdP only (profile sso-test): TEST-NET-2, a documentation range that GoTrue does not consider private
  sso-test:
    name: plat-sso-test
    ipam:
      config:
        - subnet: 198.51.100.0/24
