# Dev mode (make dev-admin): the admin console on Vite, from the checkout, with hot reload. Caddy's admin route
# (admin.localhost:8100) leads here during the session; /api goes on to the control plane. It reuses the host's
# node_modules, whose Linux native binaries pnpm also installs on macOS (supportedArchitectures, pnpm-workspace.yaml).
# No Studio dev mode until Next 16.3 (docs/TECH_DEBT.md STU-11).
services:
  admin-dev:
    image: node:22-slim
    container_name: plat-admin-dev
    user: ${DEV_USER:-1000:1000}
    working_dir: /repo/apps/admin
    command: ["node", "node_modules/vite/bin/vite.js", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
    environment:
      ADMIN_API_URL: http://control-plane:3000
    volumes:
      - ..:/repo
